```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center">
    <div class="bg-gray-800 text-white w-full max-w-md p-8 rounded-2xl shadow-2xl">
        <!-- Heading -->
        <h1 class="text-3xl font-bold text-center mb-6">
            BMI Calculator
        </h1>
        <form>
            <!-- Height -->
            <div class="mb-5">
                <label for="height" class="block text-gray-300 mb-2">
                    Height (cm)
                </label>
                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height"
                    class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 
                           focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <!-- Weight -->
            <div class="mb-5">
                <label for="weight" class="block text-gray-300 mb-2">
                    Weight (kg)
                </label>
                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 
                           focus:outline-none focus:ring-2 focus:ring-blue-500"
                >
            </div>
            <!-- Button -->
            <button
                type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 transition 
                       duration-300 py-3 rounded-lg font-semibold text-lg"
            >
                Calculate BMI
            </button>
        </form>
        <!-- Result -->
        <div class="mt-6 text-center">
            <h2 class="text-xl font-semibold mb-3">
                Your BMI
            </h2>
            <div
                id="results"
                class="text-3xl font-bold text-blue-400 min-h-11.25"
            >
            </div>
        </div>
    </div>
    <script src="../bmicalculator/bmi.js"></script>
</body>
</html>
